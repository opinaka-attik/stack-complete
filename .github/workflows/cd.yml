name: CD - Build, Push et Deploy Stack Complète

on:
  push:
    branches: [ main ]

env:
  REGISTRY  : ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────
  # JOB 1 : Tests
  # ─────────────────────────────────────────────────
  test:
    name: ✅ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancement des tests
        run: |
          pytest \
            tests/test_app.py \
            tests/test_cache.py \
            tests/test_database.py \
            tests/test_health.py \
            tests/test_stats.py \
            tests/test_users.py \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=80
        env:
          PYTHONPATH: .

  # ─────────────────────────────────────────────────
  # JOB 2 : Build et Push
  # ─────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build et Push
        uses: docker/build-push-action@v5
        with:
          context   : .
          target    : production
          push      : true
          tags      : ${{ steps.meta.outputs.tags }}
          labels    : ${{ steps.meta.outputs.labels }}

      - name: Résumé du build
        run: |
          echo "## 🐳 Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "Tags : ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────
  # JOB 3 : Deploy
  # ─────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Stack Complète
    runs-on: ubuntu-latest
    needs: build-and-push

    environment:
      name: production

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion au registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Validation des secrets ────────────────────
      - name: Validation des secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.POSTGRES_DB }}"       ] && MISSING="$MISSING POSTGRES_DB"
          [ -z "${{ secrets.POSTGRES_USER }}"     ] && MISSING="$MISSING POSTGRES_USER"
          [ -z "${{ secrets.POSTGRES_PASSWORD }}" ] && MISSING="$MISSING POSTGRES_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "❌ Secrets manquants ou vides :$MISSING"
            echo "→ Aller dans Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ Tous les secrets sont définis"

      # ── Création du .env ──────────────────────────
      - name: Création du .env de production
        run: |
          echo "APP_ENV=production"                                                                                                                  > .env
          echo "APP_VERSION=${{ github.sha }}"                                                                                                     >> .env
          echo "GITHUB_USERNAME=${{ github.actor }}"                                                                                               >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"                                                                                            >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"                                                                                        >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"                                                                                >> .env
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}" >> .env
          echo "REDIS_URL=redis://redis:6379/0"                                                                                                    >> .env

      - name: Vérification des clés .env
        run: |
          echo "Variables définies :"
          cat .env | cut -d'=' -f1

      # ── Pull des images ───────────────────────────
      - name: Pull des nouvelles images
        run: docker compose -f docker-compose.prod.yml pull

      # ─────────────────────────────────────────────
      # PHASE 1 — PostgreSQL + Redis
      # ─────────────────────────────────────────────
      - name: Démarrage PostgreSQL et Redis
        run: |
          docker compose -f docker-compose.prod.yml up -d postgres redis

      - name: Attente PostgreSQL prêt
        run: |
          echo "Attente de PostgreSQL..."
          for i in $(seq 1 30); do
            STATE=$(docker inspect --format='{{.State.Status}}' prod-postgres 2>/dev/null || echo "missing")
            if [ "$STATE" = "exited" ] || [ "$STATE" = "missing" ]; then
              echo "❌ Container PostgreSQL arrêté — logs :"
              docker logs prod-postgres
              exit 1
            fi
            if docker exec prod-postgres pg_isready -q 2>/dev/null; then
              echo "✅ PostgreSQL prêt après $i tentatives !"
              break
            fi
            echo "  → Tentative $i/30 — état: $STATE"
            if [ $i -eq 30 ]; then
              echo "❌ Timeout PostgreSQL — logs :"
              docker logs prod-postgres
              exit 1
            fi
            sleep 3
          done

      - name: Attente Redis prêt
        run: |
          echo "Attente de Redis..."
          for i in $(seq 1 20); do
            STATE=$(docker inspect --format='{{.State.Status}}' prod-redis 2>/dev/null || echo "missing")
            if [ "$STATE" = "exited" ] || [ "$STATE" = "missing" ]; then
              echo "❌ Container Redis arrêté — logs :"
              docker logs prod-redis
              exit 1
            fi
            if docker exec prod-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis prêt après $i tentatives !"
              break
            fi
            echo "  → Tentative $i/20 — état: $STATE"
            if [ $i -eq 20 ]; then
              echo "❌ Timeout Redis — logs :"
              docker logs prod-redis
              exit 1
            fi
            sleep 2
          done

      # ─────────────────────────────────────────────
      # PHASE 2 — Flask API
      # ─────────────────────────────────────────────
      - name: Démarrage API Flask
        run: |
          docker compose -f docker-compose.prod.yml up -d app

      - name: Attente API Flask prête
        run: |
          echo "Attente de l'API Flask..."
          for i in $(seq 1 30); do
            STATE=$(docker inspect --format='{{.State.Status}}' prod-api 2>/dev/null || echo "missing")
            if [ "$STATE" = "exited" ] || [ "$STATE" = "missing" ]; then
              echo "❌ Container API arrêté — logs :"
              docker logs prod-api
              exit 1
            fi
            # ✅ Port 5000 exposé dans docker-compose.prod.yml → accessible depuis le runner
            if curl -sf http://127.0.0.1:5000/health > /dev/null 2>&1; then
              echo "✅ API Flask prête après $i tentatives !"
              break
            fi
            echo "  → Tentative $i/30 — état: $STATE"
            if [ $i -eq 30 ]; then
              echo "❌ Timeout API Flask — logs :"
              docker logs prod-api
              exit 1
            fi
            sleep 3
          done

      # ─────────────────────────────────────────────
      # PHASE 3 — Nginx
      # ─────────────────────────────────────────────
      - name: Démarrage Nginx
        run: |
          docker compose -f docker-compose.prod.yml up -d nginx
          sleep 3

      - name: Attente Nginx prêt
        run: |
          echo "Attente de Nginx..."
          for i in $(seq 1 10); do
            STATE=$(docker inspect --format='{{.State.Status}}' prod-nginx 2>/dev/null || echo "missing")
            if [ "$STATE" = "exited" ] || [ "$STATE" = "missing" ]; then
              echo "❌ Container Nginx arrêté — logs :"
              docker logs prod-nginx
              exit 1
            fi
            if curl -sf http://127.0.0.1:80/health > /dev/null 2>&1; then
              echo "✅ Nginx prêt après $i tentatives !"
              break
            fi
            echo "  → Tentative $i/10 — état: $STATE"
            if [ $i -eq 10 ]; then
              echo "❌ Timeout Nginx — logs :"
              docker logs prod-nginx
              exit 1
            fi
            sleep 2
          done

      # ─────────────────────────────────────────────
      # Vérification finale complète
      # ─────────────────────────────────────────────
      - name: Vérification finale de la stack
        run: |
          echo "────────────────────────────────"
          echo "── Statut des containers ──"
          echo "────────────────────────────────"