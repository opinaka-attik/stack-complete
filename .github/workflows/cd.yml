name: CD - Build, Push et Deploy Stack Complète

on:
  push:
    branches: [ main ]

env:
  REGISTRY  : ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Tests avant tout ──────────────────────────────
  test:
    name: ✅ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancement des tests
        run: |
          pytest \
            tests/test_app.py \
            tests/test_cache.py \
            tests/test_database.py \
            tests/test_health.py \
            tests/test_stats.py \
            tests/test_users.py \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=80
        env:
          PYTHONPATH: .

  # ── Build et Push de l'image ──────────────────────
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build et Push
        uses: docker/build-push-action@v5
        with:
          context   : .
          target    : production
          push      : true
          tags      : ${{ steps.meta.outputs.tags }}
          labels    : ${{ steps.meta.outputs.labels }}

      - name: Résumé du build
        run: |
          echo "## 🐳 Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "Tags : ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ── Déploiement de la stack complète ──────────────
  deploy:
    name: 🚀 Deploy Stack Complète
    runs-on: ubuntu-latest
    needs: build-and-push

    environment:
      name: production

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion au registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Création du .env de production
        run: |
          echo "APP_ENV=production"                                                                   > .env
          echo "APP_VERSION=${{ github.sha }}"                                                       >> .env
          echo "GITHUB_USERNAME=${{ github.actor }}"                                                 >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"                                              >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"                                          >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"                                  >> .env
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}" >> .env
          echo "REDIS_URL=redis://redis:6379/0"                                                      >> .env

      - name: Vérification des clés .env
        run: |
          echo "Variables définies :"
          cat .env | cut -d'=' -f1

      - name: Pull des nouvelles images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Déploiement de la stack
        run: |
          docker compose -f docker-compose.prod.yml up -d \
            --remove-orphans

      - name: Attente PostgreSQL healthy
        run: |
          echo "Attente de PostgreSQL..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' prod-postgres 2>/dev/null || echo "starting")
            echo "  → Tentative $i/30 : $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ PostgreSQL est healthy !"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Timeout — logs PostgreSQL :"
              docker logs prod-postgres
              exit 1
            fi
            sleep 5
          done

      - name: Attente API healthy
        run: |
          echo "Attente de l'API Flask..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' prod-api 2>/dev/null || echo "starting")
            echo "  → Tentative $i/20 : $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ API est healthy !"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "❌ Timeout — logs API :"
              docker logs prod-api
              exit 1
            fi
            sleep 5
          done

      - name: Vérification finale de la stack
        run: |
          echo "── Statut des containers ──"
          docker compose -f docker-compose.prod.yml ps

          echo "── Test /health ──"
          curl -f http://localhost/health

          echo "── Test /ready ──"
          curl -f http://localhost/ready

      - name: Résumé du déploiement
        run: |
          echo "## 🚀 Stack déployée" >> $GITHUB_STEP_SUMMARY
          echo "- Version  : ${{ github.sha }}"          >> $GITHUB_STEP_SUMMARY
          echo "- Services : nginx + flask + postgres + redis" >> $GITHUB_STEP_SUMMARY
          echo "- Registry : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY